[package]
name = "crow-codegen"
version = "0.1.0"
edition = "2024"

[dependencies]
crow-mir = {path = "../crow-mir"}
crow-types ={ path = "../crow-types"}
crow-mir-monomorph = { path = "../crow-mir-monomorph" }
crow-common = { path = "../crow-common" }
crow-collect-spec-item = {path = "../crow-collect-spec-item"}
inkwell = { version = "0.5.0", features = ["llvm18-0"] }
miette = { git = "https://github.com/crow-rs/miette", features = ["fancy"] }
thiserror = "2.0.18"

[dependencies.llvm-sys]
version = "180.0.0" # Match your LLVM major version
features = ["force-dynamic"]